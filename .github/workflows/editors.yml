name: Editors

on:
  push:
    branches: [master]
    paths:
      - "editors/**"
      - ".github/workflows/editors.yml"
      - "**/*.bn"
  pull_request:
    paths:
      - "editors/**"
      - ".github/workflows/editors.yml"
      - "**/*.bn"

jobs:
  tree-sitter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter-burn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g tree-sitter-cli@0.25.10
      - name: Generated parser is up to date
        run: |
          tree-sitter generate --abi 14
          git diff --exit-code -- src
      - run: tree-sitter test
      - name: Every Burn file in the repository parses
        run: |
          git -C ../.. ls-files '*.bn' ':!tests/errors' | sed "s#^#$GITHUB_WORKSPACE/#" > "$RUNNER_TEMP/files.txt"
          tree-sitter parse -q --paths "$RUNNER_TEMP/files.txt"

  zed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-wasip1 -- -D warnings
      - run: cargo build --release --target wasm32-wasip1

  jetbrains:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0
      - run: gradle buildPlugin verifyPluginStructure
      - uses: actions/upload-artifact@v4
        with:
          name: burn-jetbrains-plugin
          path: editors/jetbrains/build/distributions/*.zip
