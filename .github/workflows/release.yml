name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v26.1.0-experimental-9 (must match VERSION in compiler/src/version.bn)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: burn-linux-x86_64.tar.gz
          - os: macos-15-intel
            asset: burn-macos-x86_64.tar.gz
          - os: macos-14
            asset: burn-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the toolchain version
        shell: bash
        run: |
          version="$(sed -n 's/^pub const VERSION = "\(.*\)"/\1/p' compiler/src/version.bn)"
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match the toolchain version $version"; exit 1; }
      - name: Build the toolchain
        run: sh scripts/package.sh --prefix "$PWD/dist/burn"
      - name: Smoke test
        run: |
          dist/burn/bin/burn --version
          dist/burn/bin/burn examples/fib.bn
      - name: Native smoke test
        run: |
          dist/burn/bin/burn build examples/fib.bn -o fib-native
          ./fib-native
      - name: Package
        run: tar -czf ${{ matrix.asset }} -C dist burn
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          files: |
            assets/*.tar.gz
            assets/SHA256SUMS
