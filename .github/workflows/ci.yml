name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy for the no-std runtime
        run: clippy-driver --edition 2021 --crate-name burn_runtime --crate-type staticlib --cfg burn_core -C panic=abort -o "$RUNNER_TEMP/libburn_core.a" crates/burn-runtime/src/lib.rs -D warnings
      - run: cargo test --release
      - name: Ember, the example language built on bvm
        run: cargo run --release -p bvm --example ember -- examples/bvm/ember/demo.em
      - name: Toolchain smoke test
        run: |
          sh scripts/package.sh --prefix "$RUNNER_TEMP/burn"
          "$RUNNER_TEMP/burn/bin/burnfmt" --check examples/*.bn lib/std/*.bn tools/burnfmt/burnfmt.bn
          "$RUNNER_TEMP/burn/bin/burni" examples/fib.bn
          "$RUNNER_TEMP/burn/bin/bvm" examples/bvm/fib.bvm
          "$RUNNER_TEMP/burn/bin/bvm" pack examples/bvm/mixins/app.bvm examples/bvm/mixins/greetlib.bvm examples/bvm/mixins/mods.bvm -o "$RUNNER_TEMP/mixins.bar"
          PATH="$RUNNER_TEMP/burn/bin:$PATH" "$RUNNER_TEMP/mixins.bar"
          cd "$RUNNER_TEMP" && PATH="$RUNNER_TEMP/burn/bin:$PATH" burn init github.com/ci/hello --no-git && cd hello && PATH="$RUNNER_TEMP/burn/bin:$PATH" burn build && ./build/hello

  stage0:
    name: The Burn compiler builds with stage0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stage0
      - name: Build the Burn compiler with the released Rust compiler
        run: burn build compiler/dump.bn -o "$RUNNER_TEMP/stage1-dump"
      - name: Run it on every Burn file in the repository
        run: git ls-files -z '*.bn' | xargs -0 "$RUNNER_TEMP/stage1-dump" > "$RUNNER_TEMP/tokens.txt" && wc -l "$RUNNER_TEMP/tokens.txt"
