name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools to cross-compile and run arm64 executables
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build the toolchain
        run: sh scripts/package.sh --prefix "$RUNNER_TEMP/burn"
      - name: End-to-end tests
        run: sh scripts/test.sh --toolchain "$RUNNER_TEMP/burn"
      - name: Toolchain smoke test
        run: |
          "$RUNNER_TEMP/burn/bin/burnfmt" --check examples/*.bn lib/std/*.bn lib/tools/*.bn
          "$RUNNER_TEMP/burn/bin/burni" examples/fib.bn
          "$RUNNER_TEMP/burn/bin/burn" run examples/fib.bn
          "$RUNNER_TEMP/burn/bin/burn" run --native examples/fib.bn
          "$RUNNER_TEMP/burn/bin/burnc" examples/fib.bn --target js -o "$RUNNER_TEMP/fib.js" && node "$RUNNER_TEMP/fib.js"
          "$RUNNER_TEMP/burn/bin/bvm" examples/bvm/fib.bvm
          "$RUNNER_TEMP/burn/bin/bvm" pack examples/bvm/mixins/app.bvm examples/bvm/mixins/greetlib.bvm examples/bvm/mixins/mods.bvm -o "$RUNNER_TEMP/mixins.bar"
          PATH="$RUNNER_TEMP/burn/bin:$PATH" "$RUNNER_TEMP/mixins.bar"
          "$RUNNER_TEMP/burn/bin/burn" build examples/bvm/ember/ember.bn -o "$RUNNER_TEMP/ember" && "$RUNNER_TEMP/ember" examples/bvm/ember/demo.em
          cd "$RUNNER_TEMP" && PATH="$RUNNER_TEMP/burn/bin:$PATH" burn init github.com/ci/hello --no-git && cd hello && PATH="$RUNNER_TEMP/burn/bin:$PATH" burn build && ./build/hello

  apple-silicon:
    name: Native executables on Apple silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the toolchain
        run: sh scripts/package.sh --prefix "$RUNNER_TEMP/burn"
      - name: End-to-end tests
        run: sh scripts/test.sh --toolchain "$RUNNER_TEMP/burn"
      - name: Toolchain smoke test
        run: |
          "$RUNNER_TEMP/burn/bin/burnc" examples/fib.bn -o "$RUNNER_TEMP/fib"
          file "$RUNNER_TEMP/fib"
          "$RUNNER_TEMP/fib"
          "$RUNNER_TEMP/burn/bin/burn" run --native examples/fib.bn

  windows-build:
    name: Build the Windows toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mingw-w64, the C compiler for Windows
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64
      - name: Build the toolchain, then the one for Windows with it
        run: |
          sh scripts/package.sh --prefix "$RUNNER_TEMP/burn"
          BURN="$RUNNER_TEMP/burn/bin/burn" sh scripts/package-windows.sh --prefix "$RUNNER_TEMP/burn-windows"
      - uses: actions/upload-artifact@v4
        with:
          name: burn-windows
          path: ${{ runner.temp }}/burn-windows

  windows:
    name: Burn on Windows
    needs: windows-build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: burn-windows
          path: burn-windows
      - name: Toolchain smoke test
        run: |
          B=burn-windows/bin/burn.exe
          "$B" version
          "$B" examples/fib.bn
          "$B" build examples/fib.bn -o fib-native
          ./fib-native.exe
          "$B" build --target bvm examples/fib.bn -o fib.bvm
          "$B" fib.bvm
          "$B" check examples/fib.bn
          burn-windows/bin/burni.exe examples/fib.bn
      - name: The test programs give their expected output, natively and on bvm
        run: |
          B=burn-windows/bin/burn.exe
          failed=""
          for f in tests/cases/*.bn; do
            name="$(basename "$f" .bn)"
            [ "$name" = process_fs ] && continue
            "$B" build "$f" -o "case-$name" >/dev/null || { failed="$failed build:$name"; continue; }
            "./case-$name.exe" > "case-$name.out" 2>&1 || true
            cmp -s "case-$name.out" "tests/cases/$name.out" || failed="$failed native:$name"
            "$B" "$f" > "case-$name.vm" 2>&1 || true
            cmp -s "case-$name.vm" "tests/cases/$name.out" || failed="$failed vm:$name"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi

  bootstrap:
    name: The Burn compiler builds itself from the seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The C compiler assembles the seed, which builds compiler/src until it is stable
        run: sh scripts/bootstrap.sh --out "$RUNNER_TEMP/bootstrap"
      - name: The compiler it built compiles a program
        run: |
          "$RUNNER_TEMP/bootstrap/compiler" build examples/fib.bn -o "$RUNNER_TEMP/fib.bvm"
          "$RUNNER_TEMP/bootstrap/compiler" build --target asm examples/fib.bn -o "$RUNNER_TEMP/fib.s"
          cc "$RUNNER_TEMP/fib.s" "$RUNNER_TEMP/bootstrap/runtime2.s" -lpthread -ldl -lm -o "$RUNNER_TEMP/fib"
          "$RUNNER_TEMP/fib"
      - name: It reads every Burn file in the repository
        run: git ls-files -z '*.bn' | xargs -0 "$RUNNER_TEMP/bootstrap/compiler" --tokens > "$RUNNER_TEMP/tokens.txt" && wc -l "$RUNNER_TEMP/tokens.txt"
