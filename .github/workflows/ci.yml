name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - name: Ember, the example language built on bvm
        run: cargo run --release -p bvm --example ember -- examples/bvm/ember/demo.em
      - name: Installer smoke test
        run: |
          ./install.sh --from-source --no-modify-path --prefix "$RUNNER_TEMP/burn"
          "$RUNNER_TEMP/burn/bin/burnfmt" --check examples/*.bn lib/std/*.bn tools/burnfmt/burnfmt.bn
          "$RUNNER_TEMP/burn/bin/burni" examples/fib.bn
          "$RUNNER_TEMP/burn/bin/bvm" examples/bvm/fib.bvm
          sh "$RUNNER_TEMP/burn/share/burn/install.sh" --uninstall --prefix "$RUNNER_TEMP/burn"
