  <rect x="495" y="80" width="110" height="34" rx="3" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="550.0" y="99.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">tag</text>
  <text x="150" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="end" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">Dog</text>
  <rect x="165" y="140" width="110" height="34" rx="3" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5"/>
  <text x="220.0" y="159.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">header</text>
  <rect x="275" y="140" width="110" height="34" rx="3" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="330.0" y="159.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">name</text>
  <rect x="385" y="140" width="110" height="34" rx="3" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="440.0" y="159.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">legs</text>
  <rect x="495" y="140" width="110" height="34" rx="3" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="550.0" y="159.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">tag</text>
  <rect x="605" y="140" width="110" height="34" rx="3" fill="#FFF3A0" stroke="#C9A227" stroke-width="1.5"/>
  <text x="660.0" y="159.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">breed</text>
  <text x="330" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">+16</text>
  <text x="440" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">+24</text>
  <text x="550" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">+32</text>
  <text x="660" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">+40</text>
  <polyline points="277,214 603,214" fill="none" stroke="#FF7F11" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="607,214 713,214" fill="none" stroke="#C9A227" stroke-width="2" stroke-linejoin="round"/>
  <text x="440" y="234" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">the same offsets as in an Animal</text>
  <text x="660" y="234" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">Dog&#x27;s own fields</text>
  <text x="30" y="284" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">That is why a Dog can be passed wherever an Animal is expected, without converting it.</text>
