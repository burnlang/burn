<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Module initialization order">
  <title>Module initialization order</title>
  <defs><marker id="a8D4A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker><marker id="a8D4A1Fs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker></defs>
  <rect x="1" y="1" width="998" height="318" rx="16" fill="#FFFBF5" stroke="#F2DCC4" stroke-width="2"/>
  <text x="30" y="42" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">Imports are initialized before the modules that use them</text>
  <rect x="60" y="90" width="170" height="56" rx="8" fill="#FFF3A0" stroke="#C9A227" stroke-width="1.5"/>
  <text x="145.0" y="112.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">std/strings</text>
  <text x="145.0" y="131.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">standard library</text>
  <rect x="60" y="200" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#8D4A1F" stroke-width="1.5"/>
  <text x="145.0" y="222.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">@/model</text>
  <text x="145.0" y="241.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">src/model.bn</text>
  <rect x="330" y="145" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#8D4A1F" stroke-width="1.5"/>
  <text x="415.0" y="167.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">@/report</text>
  <text x="415.0" y="186.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">src/report.bn</text>
  <rect x="600" y="145" width="170" height="56" rx="8" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="685.0" y="167.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">main.bn</text>
  <text x="685.0" y="186.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">then main()</text>
  <polyline points="230,118 300,118 300,165 328,165" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <polyline points="230,228 300,228 300,181 328,181" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <polyline points="500,173 598,173" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <text x="268" y="110" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">imported by</text>
  <text x="830" y="100" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">runs in this order</text>
  <text x="830" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">1  std/strings</text>
  <text x="830" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">2  @/model</text>
  <text x="830" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">3  @/report</text>
  <text x="830" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">4  main.bn</text>
  <text x="30" y="300" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">Each module runs once, however often it is imported. `burn dump --modules app.bn` prints the order.</text>
</svg>
