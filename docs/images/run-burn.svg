  <rect x="826" y="120" width="146" height="70" rx="8" fill="#E1F3DC" stroke="#3E8E3E" stroke-width="1.5"/>
  <text x="899.0" y="149.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">runs it</text>
  <text x="899.0" y="167.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">optimizing hot code</text>
  <circle cx="840" cy="120" r="12" fill="#FF7F11" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="840" y="125" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#FFFFFF" font-weight="bold" xml:space="preserve" style="white-space:pre">6</text>
  <text x="500" y="228" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">steps 2 and 3 are Burn code running on bvm; step 3 hands the module to bvm through a host function, which does 4 to 6</text>
  <text x="30" y="288" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">No second process, no files written: the compiler and the program share one bvm.</text>
