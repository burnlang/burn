  <rect x="510" y="120" width="146" height="70" rx="8" fill="#FFFFFF" stroke="#8D4A1F" stroke-width="1.5"/>
  <text x="583.0" y="149.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">links</text>
  <text x="583.0" y="167.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">+ runtime.bvm, libraries</text>
