  <text x="115.0" y="169.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">node a</text>
  <text x="115.0" y="188.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">count 1</text>
  <rect x="200" y="150" width="90" height="50" rx="8" fill="#EDE1F8" stroke="#7B4BB3" stroke-width="1.5"/>
  <text x="245.0" y="169.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">node b</text>
  <text x="245.0" y="188.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">count 1</text>
  <path d="M160,165 C180,145 180,145 200,165" fill="none" stroke="#8D4A1F" stroke-width="1.6" marker-end="url(#a8D4A1F)"/>
  <path d="M200,185 C180,205 180,205 160,185" fill="none" stroke="#8D4A1F" stroke-width="1.6" marker-end="url(#a8D4A1F)"/>
  <text x="180" y="262" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">a variable let go of node a; its count</text>
  <text x="180" y="280" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">dropped to 1, so maybe only b keeps it</text>
  <polyline points="330,190 348,190" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <rect x="350" y="64" width="300" height="250" rx="12" fill="#FFFFFF" stroke="#F2DCC4" stroke-width="1.5"/>
  <text x="500" y="94" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">2. trial deletion</text>
  <rect x="390" y="150" width="90" height="50" rx="8" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5"/>
  <text x="435.0" y="169.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">node a</text>
  <text x="435.0" y="188.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">count 0</text>
  <rect x="520" y="150" width="90" height="50" rx="8" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5"/>
  <text x="565.0" y="169.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">node b</text>
  <text x="565.0" y="188.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">count 0</text>
  <path d="M480,165 C500,145 500,145 520,165" fill="none" stroke="#8D4A1F" stroke-width="1.6" marker-end="url(#a8D4A1F)"/>
  <path d="M520,185 C500,205 500,205 480,185" fill="none" stroke="#8D4A1F" stroke-width="1.6" marker-end="url(#a8D4A1F)"/>
  <text x="500" y="262" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">subtract the references that come</text>
  <text x="500" y="280" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">from inside the group</text>
  <polyline points="650,190 668,190" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <rect x="670" y="64" width="300" height="250" rx="12" fill="#FFFFFF" stroke="#F2DCC4" stroke-width="1.5"/>
  <text x="820" y="94" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">3. collect</text>
  <rect x="710" y="150" width="90" height="50" rx="8" fill="#FFFFFF" stroke="#C62323" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="755.0" y="169.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">node a</text>
  <text x="755.0" y="188.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">freed</text>
  <rect x="840" y="150" width="90" height="50" rx="8" fill="#FFFFFF" stroke="#C62323" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="885.0" y="169.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">node b</text>
  <text x="885.0" y="188.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">freed</text>
  <path d="M800,165 C820,145 820,145 840,165" fill="none" stroke="#8D4A1F" stroke-width="1.6" marker-end="url(#a8D4A1F)"/>
  <path d="M840,185 C820,205 820,205 800,185" fill="none" stroke="#8D4A1F" stroke-width="1.6" marker-end="url(#a8D4A1F)"/>
  <text x="820" y="262" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">counts at 0: only the group itself</text>
  <text x="820" y="280" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">holds them, so both are freed</text>
  <text x="30" y="342" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">Only types that can form cycles are tracked, and only when a reference to them goes away; ordinary data is never scanned.</text>
</svg>
