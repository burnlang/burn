  <text x="180" y="94" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">1. candidate</text>
