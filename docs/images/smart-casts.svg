<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="How smart casts flow">
  <title>How smart casts flow</title>
  <defs><marker id="a3E8E3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E8E3E"/></marker><marker id="a3E8E3Es" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E8E3E"/></marker><marker id="a8D4A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker><marker id="a8D4A1Fs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker><marker id="aB9A898" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker><marker id="aB9A898s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker><marker id="aFF7F11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7F11"/></marker><marker id="aFF7F11s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7F11"/></marker></defs>
  <rect x="1" y="1" width="998" height="358" rx="16" fill="#FFFBF5" stroke="#F2DCC4" stroke-width="2"/>
  <text x="30" y="42" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">Facts flow through the branches</text>
  <rect x="330" y="70" width="340" height="44" rx="8" fill="#FFFFFF" stroke="#8D4A1F" stroke-width="1.5"/>
  <text x="500.0" y="95.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">if (value is int &amp;&amp; value &gt; 0)</text>
  <rect x="120" y="160" width="300" height="70" rx="8" fill="#E1F3DC" stroke="#3E8E3E" stroke-width="1.5"/>
  <text x="270.0" y="189.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">then: value is int</text>
  <text x="270.0" y="208.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">value + 1 is allowed</text>
  <rect x="580" y="160" width="300" height="70" rx="8" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5"/>
  <text x="730.0" y="189.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">else: nothing new is known</text>
  <text x="730.0" y="208.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">value is still any</text>
  <polyline points="420,114 270,158" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <polyline points="580,114 730,158" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <text x="320" y="140" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3E8E3E" font-weight="normal" xml:space="preserve" style="white-space:pre">true</text>
  <text x="680" y="140" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">false</text>
  <rect x="330" y="270" width="340" height="44" rx="8" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="500.0" y="295.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">after the if: only facts true on both paths</text>
  <polyline points="270,230 400,268" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <polyline points="730,230 600,268" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <text x="30" y="345" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">A branch that ends in return, break, continue, exit or panic does not join, so a guard at the top narrows the rest.</text>
</svg>
