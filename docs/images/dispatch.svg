  <text x="490.0" y="97.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">Sq</text>
  <rect x="550" y="76" width="160" height="36" rx="3" fill="#FFFFFF" stroke="#8D4A1F" stroke-width="1.5"/>
  <text x="630.0" y="97.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">Sq.area</text>
