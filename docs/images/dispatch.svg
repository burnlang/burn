  <text x="490.0" y="177.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">Circle</text>
