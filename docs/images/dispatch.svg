  <text x="30" y="274" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">3. call it: two memory reads and an indirect call</text>
  <text x="560" y="230" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">When the compiler knows the exact struct, or only one</text>
