  <polyline points="710,134 788,134" fill="none" stroke="#FF7F11" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#aFF7F11)"/>
  <text x="30" y="230" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">1. read the type id from the object&#x27;s header</text>
