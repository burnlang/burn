<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="How bvm speeds up code while it runs">
  <title>How bvm speeds up code while it runs</title>
  <defs><marker id="a8D4A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker><marker id="a8D4A1Fs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker><marker id="aB9A898" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker><marker id="aB9A898s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker></defs>
  <rect x="1" y="1" width="998" height="288" rx="16" fill="#FFFBF5" stroke="#F2DCC4" stroke-width="2"/>
  <text x="30" y="42" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">bvm gets faster while the program runs</text>
  <rect x="30" y="100" width="170" height="70" rx="8" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5"/>
  <text x="115.0" y="129.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">loaded</text>
  <text x="115.0" y="148.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">verified, not prepared</text>
  <rect x="260" y="100" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#8D4A1F" stroke-width="1.5"/>
  <text x="360.0" y="119.5" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">tier 0: first call</text>
  <text x="360.0" y="138.5" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">jumps resolved, fused</text>
  <text x="360.0" y="157.5" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">superinstructions</text>
  <rect x="530" y="100" width="200" height="70" rx="8" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="630.0" y="119.5" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">tier 1: hot</text>
  <text x="630.0" y="138.5" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">inlining, constants,</text>
  <text x="630.0" y="157.5" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">dead code, peephole</text>
  <rect x="800" y="100" width="170" height="70" rx="8" fill="#E1F3DC" stroke="#3E8E3E" stroke-width="1.5"/>
  <text x="885.0" y="119.5" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">running loops</text>
  <text x="885.0" y="138.5" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">switch at their next</text>
  <text x="885.0" y="157.5" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">iteration</text>
  <polyline points="200,135 258,135" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <polyline points="460,135 528,135" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <polyline points="730,135 798,135" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <text x="229" y="125" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">called</text>
  <text x="495" y="192" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">1000 calls or</text>
  <text x="495" y="206" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">~16,000 loop rounds</text>
  <text x="30" y="250" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">Functions that never run cost nothing. BVM_STATS=1 prints what was optimized; BVM_HOT changes the threshold.</text>
</svg>
