<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="How closures capture variables">
  <title>How closures capture variables</title>
  <defs><marker id="a8D4A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker><marker id="a8D4A1Fs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker><marker id="aB9A898" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker><marker id="aB9A898s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker><marker id="aFF7F11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7F11"/></marker><marker id="aFF7F11s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7F11"/></marker></defs>
  <rect x="1" y="1" width="998" height="358" rx="16" fill="#FFFBF5" stroke="#F2DCC4" stroke-width="2"/>
  <text x="30" y="42" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">A captured variable lives in a cell that both sides share</text>
  <rect x="30" y="70" width="330" height="250" rx="10" fill="#FFFFFF" stroke="#F2DCC4" stroke-width="1.5"/>
  <text x="46" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">fun makeCounter(): fun(): int {</text>
  <text x="46" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">    var count = 0</text>
  <text x="46" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">    return fun(): int {</text>
  <text x="46" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">        count += 1</text>
  <text x="46" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">        return count</text>
  <text x="46" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">    }</text>
  <text x="46" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">}</text>
  <text x="46" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre"></text>
  <text x="46" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">var next = makeCounter()</text>
  <text x="470" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">next</text>
  <rect x="470" y="105" width="70" height="34" rx="8" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="505.0" y="125.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">●</text>
  <text x="620" y="96" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">closure object</text>
  <rect x="620" y="105" width="100" height="34" rx="3" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5"/>
  <text x="670.0" y="124.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">header</text>
  <rect x="720" y="105" width="110" height="34" rx="3" fill="#FFF3A0" stroke="#C9A227" stroke-width="1.5"/>
  <text x="775.0" y="124.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">fn: lambda</text>
  <rect x="830" y="105" width="100" height="34" rx="3" fill="#FFF3A0" stroke="#C9A227" stroke-width="1.5"/>
  <text x="880.0" y="124.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">cell ●</text>
  <polyline points="540,122 618,122" fill="none" stroke="#FF7F11" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#aFF7F11)"/>
  <text x="700" y="216" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">cell</text>
  <rect x="700" y="225" width="100" height="34" rx="3" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5"/>
  <text x="750.0" y="244.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">header</text>
  <rect x="800" y="225" width="110" height="34" rx="3" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="855.0" y="244.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">count: 3</text>
  <polyline points="880,139 880,180 750,180 750,223" fill="none" stroke="#FF7F11" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#aFF7F11)"/>
  <text x="470" y="216" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">makeCounter&#x27;s</text>
  <text x="470" y="232" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">local `count`</text>
  <rect x="470" y="240" width="70" height="34" rx="8" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="505.0" y="260.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">●</text>
  <polyline points="540,257 698,242" fill="none" stroke="#B9A898" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#aB9A898)"/>
  <text x="470" y="300" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">while makeCounter ran, its local pointed at the same cell</text>
  <text x="30" y="344" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">Calling next() loads fn from the closure and passes the closure along, so the lambda finds its cells.</text>
</svg>
