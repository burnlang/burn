<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="x86-64 stack frame">
  <title>x86-64 stack frame</title>
  <defs><marker id="aB9A898" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker><marker id="aB9A898s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker></defs>
  <rect x="1" y="1" width="998" height="428" rx="16" fill="#FFFBF5" stroke="#F2DCC4" stroke-width="2"/>
  <text x="30" y="42" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">The stack frame of add(a, b) on x86-64</text>
  <rect x="220" y="70" width="260" height="38" rx="0" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="350.0" y="92.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">a (first argument)</text>
  <text x="200" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="end" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">rbp + 24</text>
  <rect x="220" y="108" width="260" height="38" rx="0" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="350.0" y="130.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">b (last argument)</text>
  <text x="200" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="end" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">rbp + 16</text>
  <rect x="220" y="146" width="260" height="38" rx="0" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5"/>
  <text x="350.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">return address</text>
  <text x="200" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="end" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">rbp + 8</text>
  <rect x="220" y="184" width="260" height="38" rx="0" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5"/>
  <text x="350.0" y="206.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">saved rbp</text>
  <text x="200" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="end" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">rbp</text>
  <rect x="220" y="222" width="260" height="38" rx="0" fill="#FFF3A0" stroke="#C9A227" stroke-width="1.5"/>
  <text x="350.0" y="244.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">local 0: a</text>
  <text x="200" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="end" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">rbp - 8</text>
  <rect x="220" y="260" width="260" height="38" rx="0" fill="#FFF3A0" stroke="#C9A227" stroke-width="1.5"/>
  <text x="350.0" y="282.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">local 1: b</text>
  <text x="200" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="end" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">rbp - 16</text>
  <rect x="220" y="298" width="260" height="38" rx="0" fill="#FFF3A0" stroke="#C9A227" stroke-width="1.5"/>
  <text x="350.0" y="320.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">local 2: a + b</text>
  <text x="200" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="end" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">rbp - 24</text>
  <text x="200" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="13" text-anchor="end" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">rsp</text>
  <text x="500" y="110" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">pushed by the caller, first argument first;</text>
  <text x="500" y="128" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">the caller removes them after the call</text>
  <text x="500" y="168" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">call and push rbp</text>
  <text x="500" y="240" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">sub rsp, 32: locals at fixed offsets;</text>
  <text x="500" y="258" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">expressions are computed in rax</text>
  <polyline points="70,70 70,360" fill="none" stroke="#B9A898" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#aB9A898)"/>
  <text x="70" y="382" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">lower addresses</text>
  <text x="30" y="410" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">Results return in rax (x0 on ARM). Calls into the runtime switch to the C calling convention with a 16-byte aligned stack.</text>
</svg>
