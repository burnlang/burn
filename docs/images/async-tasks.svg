<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Async tasks on threads">
  <title>Async tasks on threads</title>
  <defs><marker id="a3E8E3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E8E3E"/></marker><marker id="a3E8E3Es" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E8E3E"/></marker><marker id="a8D4A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker><marker id="a8D4A1Fs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker><marker id="aB9A898" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker><marker id="aB9A898s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker><marker id="aFF7F11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7F11"/></marker><marker id="aFF7F11s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7F11"/></marker></defs>
  <rect x="1" y="1" width="998" height="328" rx="16" fill="#FFFBF5" stroke="#F2DCC4" stroke-width="2"/>
  <text x="30" y="42" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">Each async call runs on its own thread</text>
  <text x="40" y="98" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">main</text>
  <polyline points="110,94 930,94" fill="none" stroke="#8D4A1F" stroke-width="3" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <text x="40" y="168" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">task a</text>
  <polyline points="200,164 520,164" fill="none" stroke="#3E8E3E" stroke-width="3" stroke-linejoin="round"/>
  <text x="40" y="228" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">task b</text>
  <polyline points="270,224 640,224" fill="none" stroke="#3E8E3E" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="200,94 200,162" fill="none" stroke="#FF7F11" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#aFF7F11)"/>
  <polyline points="270,94 270,222" fill="none" stroke="#FF7F11" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#aFF7F11)"/>
  <text x="150" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">a = download(1)</text>
  <text x="250" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="start" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">b = download(2)</text>
  <polyline points="520,164 520,96" fill="none" stroke="#3E8E3E" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#a3E8E3E)"/>
  <polyline points="640,224 640,96" fill="none" stroke="#3E8E3E" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#a3E8E3E)"/>
  <rect x="470" y="106" width="100" height="26" rx="8" fill="#E1F3DC" stroke="#3E8E3E" stroke-width="1.5"/>
  <text x="520.0" y="121.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">await a</text>
  <rect x="590" y="106" width="100" height="26" rx="8" fill="#E1F3DC" stroke="#3E8E3E" stroke-width="1.5"/>
  <text x="640.0" y="121.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" text-anchor="middle" fill="#2B1A10" font-weight="normal" xml:space="preserve" style="white-space:pre">await b</text>
  <text x="520" y="186" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">result stored in the future</text>
  <text x="640" y="246" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">result stored in the future</text>
  <text x="870" y="82" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">exit</text>
  <text x="30" y="280" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">A call returns a Future at once; await blocks until the result is there. The program exits only after every task has finished.</text>
  <text x="30" y="300" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">While tasks run, reference counts use atomic operations, so tasks can share objects safely.</text>
</svg>
