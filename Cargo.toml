[workspace]
resolver = "2"
members = ["crates/burn", "crates/burn-runtime"]

[workspace.package]
version = "26.1.0-experimental-1"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/burnlang/burn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
